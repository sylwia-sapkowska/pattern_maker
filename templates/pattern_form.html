<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Additional data</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
        <div class="container-fluid border py-3 my-3 bg-light text-dark shadow">
            <center>
                <h1>Additional data form</h1>
            </center>
            
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
            
            <form method="post" action="/pattern">
                <div class="container">
                    
                    <div class="container py-1 my-1">   
                        <label for="width">Width (in number of stitches):</label>
                        <input type="number" name="width_stitches" id="width_stitches" required min="1" max="10000" step="1" value="300">
                    </div>  
                    <div class="container py-1 my-1">
                        <label for="colors">Number of colors:</label>
                        <input type="number" name="number_of_colors" id="number_of_colors" required min="1" max="200" step="1" value="30">
                    </div>    
                    <div class="container py-1 my-1">
                        <label for="dithering">Method of dithering:</label>
                        <select name="method_of_dithering" id="method_of_dithering" required>
                            <option value="none">None</option>
                            <option value="floyd-steinberg">Floyd-Steinberg</option>
                            <option value="atkinson">Atkinson</option>
                        </select>
                    </div>
                    <!-- added a filename from the previous page-->
                    <input type="hidden" name="filename" value="{{ filename }}">
                    <input type="submit" value="Create pattern">
                </div>
            </form>
        </div>
        <!-- show image under {{ filename }} -->
        <div class="container-fluid border py-3 my-3 bg-light text-dark shadow">
            <center>
                <h1>Uploaded image</h1>
            
                <img src="{{ filepath }}" alt="Uploaded image" style="max-width: 100%; max-height: 100%; height: auto; width: auto;">
                <p>Filename: {{ filename }}</p>
            </center>
        </div>
    </body>
</html>
